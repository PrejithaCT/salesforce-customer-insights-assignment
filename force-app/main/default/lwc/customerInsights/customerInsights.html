<template>
    <lightning-card title="Customer Insights" icon-name="standard:contact">
        <div class="slds-p-around_medium">

            <lightning-input
                label="Customer ID"
                value={customerId}
                placeholder="Enter Contact Id"
                onchange={handleCustomerIdChange}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Load Customer"
                    variant="brand"
                    onclick={loadCustomerInsights}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error slds-m-top_medium">
                    {error}
                </div>
            </template>

            <template if:true={customer}>
                <div class="slds-box slds-m-top_medium">
                    <h2 class="slds-text-heading_medium">{customer.name}</h2>
                    <p><strong>Customer ID:</strong> {customer.customerId}</p>
                    <p><strong>Email:</strong> {customer.email}</p>
                    <p><strong>Phone:</strong> {customer.phone}</p>
                </div>

                <div class="slds-grid slds-gutters slds-m-top_medium">
                    <div class="slds-col">
                        <div class="slds-box">
                            <p class="label">Engagement Score</p>
                            <p class="score">{customer.engagementScore}</p>
                        </div>
                    </div>

                    <div class="slds-col">
                        <div class="slds-box">
                            <p class="label">Intent Level</p>
                            <p class={intentClass}>{customer.intentLevel}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-col">
                    <div class="slds-box insight-card">
                        <p class="label">Product Interest</p>
                        <p class="product-interest">
                            {customer.productInterest}
                        </p>
                    </div>
                </div>
                <div class="slds-box slds-m-top_medium">
                    <div class="slds-grid slds-grid_align-spread">
                        <h3 class="slds-text-heading_small">Recent Activity</h3>
                        <lightning-button
                            label={activityButtonLabel}
                            onclick={toggleActivities}>
                        </lightning-button>
                    </div>

                    <template if:true={showActivities}>
                        <template if:true={hasActivities}>
                            <ul class="slds-m-top_medium">
                                <template for:each={customer.recentActivities} for:item="activity">
                                    <li key={activity.key} class="activity-item">
                                        <strong>{activity.type}</strong> - {activity.subject}
                                        <br />
                                        <span>{activity.activityDate} | {activity.status}</span>
                                    </li>
                                </template>
                            </ul>
                        </template>

                        <template if:false={hasActivities}>
                            <p class="slds-m-top_medium">No recent activity found.</p>
                        </template>
                    </template>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Get Recommendation"
                        variant="success"
                        onclick={getAIRecommendation}
                        disabled={isRecommendationLoading}>
                    </lightning-button>
                </div>

                <template if:true={isRecommendationLoading}>
                    <div class="slds-m-top_medium">
                        <lightning-spinner alternative-text="Loading recommendation"></lightning-spinner>
                    </div>
                </template>

                <template if:true={recommendation}>
                    <div class="slds-box slds-theme_success slds-m-top_medium">
                        <h3 class="slds-text-heading_small">AI Recommendation</h3>
                        <p><strong>Recommendation:</strong> {recommendation.recommendation}</p>
                        <p><strong>Reason:</strong> {recommendation.reason}</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
